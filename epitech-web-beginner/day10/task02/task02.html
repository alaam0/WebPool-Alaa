 <head>

 <body class="container py-4">
  <!-- Displays a heading or paragraph of text. -->
  <h1>
   Check email
  <!-- Closes the matching HTML element. -->
  </h1>
  <!-- Creates a form for collecting and submitting user input. -->
  <form id="emailForm">
   <!-- Creates an input field; its attributes control its type, name, and behavior. -->
   <input class="form-control mb-2" name="email" placeholder="Email" type="email"/>
   <!-- Creates a clickable button. -->
   <button class="btn btn-primary">
    Check
   <!-- Closes the matching HTML element. -->
   </button>
  <!-- Closes the matching HTML element. -->
  </form>
  <!-- Loads or starts JavaScript for page interactions. -->
  <script>
   document.getElementById('emailForm').addEventListener('submit',e=>{e.preventDefault();fetch('task02.php',{method:'POST',body:new FormData(e.target)}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(()=>alert('Email is valid')).catch(()=>alert('Email is not valid'));});
  </script>
 <!-- Closes the matching HTML element. -->
 </body>

</html>
