<!DOCTYPE html>
<!-- Starts the HTML document and may set its language. -->
<html lang="en">
 <!-- Starts the page's metadata and linked resources. -->
 <head>
  <!-- Defines an HTML element or attribute; check its tag name and values. -->
  <meta charset="utf-8"/>
  <!-- Defines an HTML element or attribute; check its tag name and values. -->
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <!-- Defines an HTML element or attribute; check its tag name and values. -->
  <title>
   AJAX task
  <!-- Closes the matching HTML element. -->
  </title>
  <!-- Links a resource such as the CSS stylesheet. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
 <!-- Closes the matching HTML element. -->
 </head>
 <!-- Starts the visible page content. -->
 <body class="container py-4">
  <!-- Displays a heading or paragraph of text. -->
  <h1>
   Mini chat
  <!-- Closes the matching HTML element. -->
  </h1>
  <!-- Creates a structural container used to group or style page content. -->
  <div class="mb-2">
   <!-- Creates an input field; its attributes control its type, name, and behavior. -->
   <input class="form-control" id="name" placeholder="Your name"/>
  <!-- Closes the matching HTML element. -->
  </div>
  <!-- Creates a structural container used to group or style page content. -->
  <div class="mb-2">
   <!-- Creates an input field; its attributes control its type, name, and behavior. -->
   <input class="form-control" id="message" placeholder="Your message"/>
  <!-- Closes the matching HTML element. -->
  </div>
  <!-- Creates a clickable button. -->
  <button class="btn btn-primary" id="send">
   Send
  <!-- Closes the matching HTML element. -->
  </button>
  <!-- Creates a structural container used to group or style page content. -->
  <div class="mt-4" id="messages">
  <!-- Closes the matching HTML element. -->
  </div>
  <!-- Loads or starts JavaScript for page interactions. -->
  <script>
   async function load(){const r=await fetch('chat.php');const data=await r.json();const box=document.getElementById('messages');box.innerHTML='';data.forEach(m=>{const p=document.createElement('p');p.textContent=m.name+': '+m.message;box.appendChild(p);});}document.getElementById('send').addEventListener('click',async()=>{await fetch('chat.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,message:document.getElementById('message').value})});document.getElementById('message').value='';load();});load();setInterval(load,4000);
  </script>
 <!-- Closes the matching HTML element. -->
 </body>
<!-- Closes the HTML document. -->
</html>
