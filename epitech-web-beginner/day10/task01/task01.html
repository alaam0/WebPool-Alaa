<!DOCTYPE html>
<!-- Starts the HTML document and may set its language. -->
<html lang="en">
 <!-- Starts the page's metadata and linked resources. -->
 <head>
  <!-- Defines an HTML element or attribute; check its tag name and values. -->
  <meta charset="utf-8"/>
  <!-- Defines an HTML element or attribute; check its tag name and values. -->
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <!-- Defines an HTML element or attribute; check its tag name and values. -->
  <title>
   AJAX task
  <!-- Closes the matching HTML element. -->
  </title>
  <!-- Links a resource such as the CSS stylesheet. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
 <!-- Closes the matching HTML element. -->
 </head>
 <!-- Starts the visible page content. -->
 <body class="container py-4">
  <!-- Displays a heading or paragraph of text. -->
  <h1>
   Say hello
  <!-- Closes the matching HTML element. -->
  </h1>
  <!-- Creates an input field; its attributes control its type, name, and behavior. -->
  <input class="form-control mb-2" id="name" placeholder="Your name"/>
  <!-- Creates a clickable button. -->
  <button class="btn btn-primary" id="send">
   Send
  <!-- Closes the matching HTML element. -->
  </button>
  <!-- Loads or starts JavaScript for page interactions. -->
  <script>
   document.getElementById('send').addEventListener('click',()=>{fetch('task01.php?name='+encodeURIComponent(document.getElementById('name').value)).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>alert(data.name)).catch(()=>alert('An error occurred'));});
  </script>
 <!-- Closes the matching HTML element. -->
 </body>
<!-- Closes the HTML document. -->
</html>
